<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript learning illustration</title>
  <desc id="desc">A dark code editor with JavaScript and Node.js learning symbols.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2028"/><stop offset="1" stop-color="#0c0f14"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5b873"/><stop offset="1" stop-color="#a87432"/></linearGradient>
  </defs>
  <rect x="18" y="18" width="684" height="484" rx="32" fill="url(#bg)" stroke="#343b47" stroke-width="2"/>
  <rect x="54" y="54" width="612" height="58" rx="15" fill="#171b22"/>
  <circle cx="84" cy="83" r="7" fill="#e5b873"/><circle cx="108" cy="83" r="7" fill="#9dbb82"/><circle cx="132" cy="83" r="7" fill="#707985"/>
  <rect x="54" y="132" width="390" height="300" rx="18" fill="#0b0d11" stroke="#2c323c"/>
  <rect x="468" y="132" width="198" height="142" rx="18" fill="#171b22" stroke="#343b47"/>
  <rect x="468" y="292" width="198" height="140" rx="18" fill="#171b22" stroke="#343b47"/>
  <g font-family="monospace" font-size="18">
    <text x="78" y="174" fill="#8d97a5">01</text><text x="112" y="174" fill="#e5b873">const</text><text x="174" y="174" fill="#f4f6f8">course</text><text x="244" y="174" fill="#9dbb82">=</text><text x="260" y="174" fill="#9dbb82">"Node.js"</text>
    <text x="78" y="210" fill="#8d97a5">02</text><text x="112" y="210" fill="#e5b873">async</text><text x="180" y="210" fill="#f4f6f8">function</text><text x="276" y="210" fill="#f4f6f8">learn()</text><text x="350" y="210" fill="#9dbb82">{</text>
    <text x="78" y="246" fill="#8d97a5">03</text><text x="130" y="246" fill="#e5b873">await</text><text x="198" y="246" fill="#f4f6f8">understand</text><text x="310" y="246" fill="#9dbb82">();</text>
    <text x="78" y="282" fill="#8d97a5">04</text><text x="130" y="282" fill="#9dbb82">return</text><text x="210" y="282" fill="#f4f6f8">"build"</text><text x="292" y="282" fill="#9dbb82">;</text>
    <text x="78" y="318" fill="#8d97a5">05</text><text x="112" y="318" fill="#9dbb82">}</text>
    <text x="78" y="374" fill="#8d97a5">06</text><text x="112" y="374" fill="#f4f6f8">console.log</text><text x="230" y="374" fill="#9dbb82">(course)</text>
  </g>
  <g font-family="Cairo, Arial, sans-serif">
    <text x="494" y="174" fill="#9dbb82" font-size="15" font-weight="700">LEARNING PATH</text>
    <text x="494" y="207" fill="#f4f6f8" font-size="22" font-weight="800">JavaScript</text>
