    <text x="494" y="332" fill="#e5b873" font-size="15" font-weight="700">DEEP DIVE</text>
    <text x="494" y="365" fill="#f4f6f8" font-size="20" font-weight="800">Understand</text>
    <text x="494" y="394" fill="#a9b0bb" font-size="15">Internals • Practice • Review</text>
